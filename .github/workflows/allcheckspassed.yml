name: allcheckspassed
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled

jobs:
  allchecks:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - uses: wechuli/allcheckspassed@5b5009ffd707b7c6759574c984bb666034b441eb
        with:
          delay: 3
          retries: 30
          polling_interval: 1